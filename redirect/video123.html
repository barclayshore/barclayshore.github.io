<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open in Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 14px;
        line-height: 1.6;
        text-align: left;
    }
    .container {
        margin-top: 40px;
    }
    .instructions {
        font-size: 12px;
        color: #333;
    }
</style>
<script>
    // Detect WeChat internal browser
    var ua = navigator.userAgent.toLowerCase();
    var isWeChat = ua.indexOf("micromessenger") !== -1;

    // Your YouTube target link
    var target = "https://youtu.be/U944W6U6scc?si=dg_IAvko0b3crdbu";

    if (!isWeChat) {
        // Safe to redirectt
        window.location.href = target;
    }
</script>
</head>
<body>
<div class="container">
    <h2>Open in Browser to Continue</h2>
    <p class="instructions">
        To watch, like, and subscribe on YouTube,<br>
        please open this page in your browser.
    </p>
    <p class="instructions">
        In WeChat: tap the <strong>⋯</strong> in the top-right corner,<br>
        then choose <strong>“Open in Browser”</strong>.
    </p>
</div>
</body>
</html>
